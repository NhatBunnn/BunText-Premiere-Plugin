<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BunText</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="panel-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">B</div>
        <h1 class="brand-name">BunText</h1>
      </div>
      <span class="version-badge">v1.1</span>
    </header>

    <!-- Host Connection Status -->
    <div class="host-status" id="hostStatus">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Checking Premiere Pro host...</span>
    </div>

    <!-- Template Card -->
    <main class="template-card">
      <div class="preview-container">
        <img
          id="templatePreview"
          class="preview-img"
          src="assets/preview.png"
          alt="hello 2.mogrt preview"
        />
        <!-- Dynamic Live Text Preview Overlay -->
        <div class="preview-text-overlay" id="previewTextOverlay">HELLO</div>
        <div id="previewFallback" class="preview-placeholder" style="display: none;">
          <span>Motion Graphics Template</span>
        </div>
      </div>

      <div class="card-body">
        <div class="template-header">
          <h2 class="template-title" id="templateName">hello 2.mogrt</h2>
          <span class="template-format">MOGRT</span>
        </div>

        <div class="template-meta">
          <span class="meta-chip">⏱ 10.0s</span>
          <span class="meta-chip">📺 1920×1080</span>
          <span class="meta-chip" id="metaTextTag">✏️ Text: "HELLO"</span>
        </div>

        <!-- Properties Customization Section -->
        <section class="properties-section">
          <div class="section-title">
            <span>PROPERTIES / TÙY CHỈNH</span>
          </div>

          <!-- Text Input Group -->
          <div class="prop-group">
            <div class="prop-label-row">
              <label class="prop-label" for="propText">Nội dung chữ (Text):</label>
              <div class="prop-tools">
                <button type="button" class="btn-text-case" id="btnToggleCase" title="Chuyển hoa / thường">AA</button>
              </div>
            </div>
            <div class="input-wrapper">
              <input
                type="text"
                id="propText"
                class="prop-input"
                value="HELLO"
                placeholder="Nhập nội dung chữ..."
              />
              <button type="button" id="btnClearText" class="btn-clear" title="Xóa">✕</button>
            </div>
          </div>

          <!-- Font Size Group -->
          <div class="prop-group">
            <div class="prop-label-row">
              <label class="prop-label" for="propFontSize">Cỡ chữ (Font Size):</label>
              <span class="prop-val-display" id="fontSizeDisplay">180 px</span>
            </div>
            <div class="slider-row">
              <input
                type="range"
                id="propFontSize"
                class="prop-slider"
                min="60"
                max="360"
                value="180"
                step="5"
              />
            </div>
          </div>
        </section>

        <!-- Timeline Target Settings -->
        <section class="settings-section">
          <div class="settings-row">
            <label class="setting-label" for="trackSelect">Target Video Track:</label>
            <select id="trackSelect" class="setting-select">
              <option value="1" selected>V2 (Recommended)</option>
              <option value="0">V1</option>
              <option value="2">V3</option>
              <option value="3">V4</option>
            </select>
          </div>
          <div class="settings-row">
            <label class="setting-label" for="positionSelect">Insert Position:</label>
            <select id="positionSelect" class="setting-select">
              <option value="playhead" selected>Current Playhead (CTI)</option>
              <option value="start">Sequence Start (00:00:00:00)</option>
            </select>
          </div>
        </section>

        <!-- Action Buttons -->
        <div class="action-buttons-group">
          <button id="btnApply" class="btn-apply">
            <svg class="btn-icon" viewBox="0 0 24 24">
              <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
            </svg>
            <span>Chèn vào Timeline</span>
          </button>

          <button id="btnUpdateSelected" class="btn-secondary" title="Đổi chữ cho clip MOGRT đang chọn trên Timeline">
            <svg class="btn-icon" viewBox="0 0 24 24">
              <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
            </svg>
            <span>Cập nhật Clip đang chọn</span>
          </button>
        </div>

        <!-- Status Notification Message -->
        <div id="notificationBox" class="notification-box"></div>
      </div>
    </main>

    <!-- Diagnostics and Log Toggle -->
    <div class="diagnostics-toggle" id="diagnosticsToggle">
      <span>▶ Diagnostics &amp; API Details</span>
    </div>
    <pre class="diagnostics-content" id="diagnosticsLog">Initializing BunText UXP plugin...</pre>
  </div>

  <script src="index.js"></script>
</body>
</html>
